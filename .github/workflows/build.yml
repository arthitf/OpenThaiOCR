# สร้างโปรแกรมบนคลาวด์ของ GitHub ทั้ง Windows, Mac ชิป M และ Linux
# วิธีใช้: แท็บ Actions > Build OpenThai OCR > Run workflow
# เสร็จแล้วโหลดไฟล์จากหัวข้อ Artifacts ด้านล่างของหน้าผลการรัน
name: Build OpenThai OCR

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: OpenThaiOCR_Setup_win
          path: dist/OpenThaiOCR_Setup_*.exe
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: OpenThaiOCR_win
          path: dist/OpenThaiOCR_win.zip
          compression-level: 0

  mac-apple-silicon:
    runs-on: macos-latest   # เครื่อง Mac ชิป M (arm64)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: bash build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OpenThaiOCR_mac_dmg
          path: dist/OpenThaiOCR_mac.dmg
          compression-level: 0

  linux:
    runs-on: ubuntu-22.04   # glibc 2.35 — ใช้ได้กับ Ubuntu 22.04+ / Debian 12+ / Fedora 36+
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tk8.6 libtk8.6 xvfb fonts-thai-tlwg
      - name: Build
        run: bash build_linux.sh
      - name: Smoke test (open the app for 20s)
        run: |
          set +e
          xvfb-run -a timeout 20 dist/OpenThaiOCR/OpenThaiOCR
          code=$?
          echo "exit code $code (124 = still running after 20s = OK)"
          [ $code -eq 124 ]
      - uses: actions/upload-artifact@v4
        with:
          name: OpenThaiOCR_linux_x64
          path: dist/OpenThaiOCR_linux_x64.tar.gz
          compression-level: 0
