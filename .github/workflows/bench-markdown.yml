# ทดสอบเทียบ OpenThai2.0-OCR-Text (ที่ใช้อยู่) กับ OpenThai2.1-OCR-Markdown บน CPU
# ข้อความ + ตาราง + หน้าว่าง (ข้อมูลสมมติทั้งหมด)  ผลอยู่ในหน้าสรุปของการรัน
name: Benchmark OCR Markdown
on:
  workflow_dispatch:
    inputs:
      md_repo:
        description: HF repo ของโมเดล Markdown
        default: iapp/OpenThai2.1-OCR-Markdown-20261118
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q fonts-thai-tlwg
      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q -r requirements.txt rapidfuzz huggingface_hub "transformers==5.14.1" "timm==1.0.22" einops accelerate beautifulsoup4
          lscpu | grep -E "Model name|^CPU\(s\)"
      - name: Download models
        env:
          MD_REPO: ${{ inputs.md_repo }}
        run: |
          python -c "from huggingface_hub import snapshot_download as s; s('iapp/OpenThai2.0-OCR-Text', local_dir='model', allow_patterns=['*.onnx','*.yml','config.json','rec_dict.txt','runtime/*','NOTICE','README.md','SHA256SUMS'])"
          python -c "import os; from huggingface_hub import snapshot_download as s; s(os.environ['MD_REPO'], local_dir='md_model', ignore_patterns=['dflash2/*','reference/*','assets/*','tests/*','*.gguf'])"
          du -sh md_model
      - name: Benchmark
        env:
          PYTHONIOENCODING: utf-8
          MD_MAX_TOKENS: "4096"
        run: python bench/markdown_vs_openthai.py --model model --md md_model --out bench_md
